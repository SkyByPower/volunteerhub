# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: volunteerhub-skybypower
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # free instances have no persistent disk, so the demo DB is re-seeded on every start
    startCommand: flask --app run.py seed && gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
